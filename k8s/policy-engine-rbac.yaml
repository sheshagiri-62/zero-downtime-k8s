# Note: This ServiceAccount is defined but not yet bound to the running policy-engine
# process (which still uses the local kubeconfig). This is prep for containerizing it later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-engine-sa
  namespace: zero-downtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: policy-engine-role
  namespace: zero-downtime
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: policy-engine-rolebinding
  namespace: zero-downtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: policy-engine-role
subjects:
  - kind: ServiceAccount
    name: policy-engine-sa
    namespace: zero-downtime
