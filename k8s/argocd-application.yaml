apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zero-downtime-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sheshagiri-62/zero-downtime-k8s.git'
    path: k8s
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: zero-downtime
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
