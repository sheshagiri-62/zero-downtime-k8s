apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sa
  namespace: zero-downtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-role
  namespace: zero-downtime
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/status", "rollouts/scale", "analysisruns", "experiments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-rolebinding
  namespace: zero-downtime
subjects:
  - kind: ServiceAccount
    name: dashboard-sa
    namespace: zero-downtime
roleRef:
  kind: Role
  name: dashboard-role
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole for listing nodes (cluster-scoped resource)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: dashboard-sa
    namespace: zero-downtime
roleRef:
  kind: ClusterRole
  name: dashboard-node-reader
  apiGroup: rbac.authorization.k8s.io
